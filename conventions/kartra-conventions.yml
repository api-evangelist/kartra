  authentication: authentication/kartra-authentication.yml
  errors: errors/kartra-error-codes.yml
  lifecycle: lifecycle/kartra-lifecycle.yml
  rate_limits: rate-limits/kartra-rate-limits.yml
  sandbox: sandbox/kartra-sandbox.yml
  data_model: data-model/kartra-data-model.yml
