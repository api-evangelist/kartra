apis:
- aid: kartra:kartra-api
  name: Kartra API
  description: >-
    Kartra's inbound developer API. One endpoint, POST only, form-encoded, with
    the operation selected by `actions[].cmd`. Twenty-nine documented commands
    cover leads, tags, lists, automation sequences, custom fields, lead scoring,
    pages, calendar bookings, payment transactions and recurring subscriptions.
    Every call carries three credentials in the body — the developer's `app_id`
    plus the end user's `api_key` and `api_password` — and acts on exactly one
    lead. Rate limited to 20 calls per second per App.
  humanURL: https://support.kartra.com/en/collections/19655232-developers
