aid: kartra
name: Kartra
description: >-
  Kartra is an all-in-one online business platform operated by Kartra, Inc. of
  Las Vegas, Nevada, that bundles landing pages and funnels, email marketing with automation sequences,
  checkouts and recurring billing, membership sites and courses, video hosting,
  calendars and booking, helpdesks, affiliate management and lead scoring into a
  single subscription. Its developer surface is three distinct things: an
  inbound API that is a single form-encoded POST endpoint at
  https://app.kartra.com/api driven by 29 documented `cmd` values and scoped to
  exactly one lead per call; an outbound API that POSTs 24 JSON lead and
  commerce events to URLs configured in the account; and an IPN system that
  POSTs six payment-lifecycle notifications as flat form variables. Kartra
  publishes no OpenAPI, no SDK in any language, no signed webhooks and no
  idempotency contract, and it returns HTTP 200 for every outcome including
  authentication failure — the numeric `type` field in the response body is the
  real error signal.
