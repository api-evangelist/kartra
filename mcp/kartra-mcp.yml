agent_hazards:
- Six commands move or alter money (refund_transaction, cancel_transaction, modify_subscription_status,
  edit_subscription) or customer billing state; none are idempotent and none can be safely retried.
- Every response is HTTP 200. An agent branching on transport status will read a refund failure as a success.
- Chained calls return per-action statuses inside actions[]; a top-level Success does not mean each action
  succeeded.
