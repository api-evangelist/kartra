summary: No official hosted or remote Model Context Protocol server was found for Kartra. mcp.kartra.com
  resolves only to the wildcard catch-all that 307s every unknown subdomain into the Auth0 login flow;
  /mcp on kartra.com and app.kartra.com both 404; no Kartra server appears in the public MCP registries
  or under @modelcontextprotocol on npm. The candidate tool set below is DERIVED one-to-one from the 29
  `cmd` values Kartra documents for its inbound API, plus the top-level `get_lead` request. It is a proposal
  for an agent-facing surface and is NOT published by Kartra.
server: null
transport: null
url: null
auth:
  type: apiKey
  location: request body
  fields:
  - app_id
  - api_key
  - api_password
  note: Any MCP server fronting Kartra must carry three credentials, two of which (api_key, api_password)
    belong to the END USER's Kartra account while app_id belongs to the integration developer. That split
    is unusual for an MCP deployment and means a shared hosted server cannot use one credential set for
    all users.
backing_surface:
  endpoint: https://app.kartra.com/api
  method: POST
  encoding: application/x-www-form-urlencoded
  operation_selector: actions[].cmd
  constraint: Every call targets exactly ONE lead. A tool set derived from these commands inherits that
    constraint — there is no batch or multi-subject tool possible.
input_schema_note: Kartra publishes no OpenAPI, so no tool below can inherit a machine-readable inputSchema.
  Parameters are documented in prose tables per article; the `source` on each tool is where a real schema
  would have to be transcribed from by hand.
