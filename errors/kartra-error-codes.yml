format: proprietary
format_note: >-
  Kartra does NOT use RFC 9457 problem+json. It returns a flat proprietary
  envelope and — critically — sends it with HTTP 200: "All success or error
  messages are sent with HTTP response status code 200." The only documented
  non-200 is 429 on rate-limit exhaustion. The numeric `type` field is the
  stable machine-readable error identity; the `message` string is prose and
  should not be matched on.
envelope:
  transport_status: 200
  fields:
  - {name: status, type: string, values: [Success, Error], note: 'Casing varies across the docs ("success"/"Success"); match case-insensitively.'}
  - {name: message, type: string, note: Human-readable description. Prose, not a stable contract.}
  - {name: type, type: string, note: 'Numeric message ID as a STRING, e.g. "244". This is the identifier to branch on.'}
  example_error: '{"status": "Error", "message": "Lead already exists", "type": "244"}'
  example_success: '{"status": "Success", "actions": [{"create_lead": {"status": "Success", "lead_details": {"id": "1234"}}}]}'
  per_action_note: >-
    On a chained call the top-level status reports the call, and each entry in
    actions[] carries its OWN status/message/type. A 200 with top-level
    "Success" does NOT mean every chained action succeeded — an agent must walk
    actions[] and check each one.
