gaps:
- No RFC 9457 application/problem+json representation.
- Errors are not surfaced through HTTP status codes, so standard HTTP client error handling is inert against this API.
- Codes 205, 210, 216, 218, 221, 222, 232, 235, 237, 241, 246, 279, 286-289 are absent from the public docs; the registry is published per-action, not as one consolidated table, so the numbering has gaps we cannot fill without inventing them.
- Duplicate meanings carry distinct codes depending on the command (e.g. "List cannot be empty" is 207 on subscribe and 208 on unsubscribe; "No lead found" is 234 on retrieve and 243 on search).
