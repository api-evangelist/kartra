pointer_emitted: false
pointer_reason: >-
  No 200 carrying a document Kartra itself authored. Per the enrichment
  contract a WellKnown/SecurityTxt pointer asserts the PROVIDER serves that
  surface; a vendor's security.txt on a vendor-hosted docs subdomain does not
  satisfy that.
