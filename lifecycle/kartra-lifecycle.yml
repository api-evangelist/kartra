  sunset_header: false
  deprecation_header: false
  note: >-
    Kartra publishes no deprecation policy, no advance-notice window and no
    RFC 8594 Sunset/Deprecation header support. Removals are announced only in
    the release notes AFTER they ship — the 9.75.0 notes (2026-07-21) record
    that the Skype channel was removed from Helpdesks and the Facebook Comments
    widget from the page builder, both already applied to existing accounts at
    publication. Because no policy exists, NO Deprecation pointer is emitted.
